[project]
name = "ingen-fleetlink-v1-0"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

